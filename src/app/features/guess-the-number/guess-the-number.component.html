<div class="game-container">
  <h1>Guess the Number</h1>
  <p>Between 1 and {{ maxNumber }}</p>

  <input
    type="number"
    [(ngModel)]="guessedNumber"
    [disabled]="gameOver"
    min="1"
    [max]="maxNumber"
    placeholder="Enter number"
  />

  <button (click)="submitGuess()" [disabled]="gameOver">Guess</button>

  <p>Attempts left: {{ attemptsLeft }}</p>

  <p *ngIf="feedback">{{ feedback }}</p>

  <button *ngIf="gameOver" (click)="resetGame()">Play Again</button>
</div>
